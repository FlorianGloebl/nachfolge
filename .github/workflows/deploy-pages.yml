name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No BASE_PATH override: the site now targets the custom domain
      # www.nachfolge.g-u-p.de (served from "/"), configured via the
      # public/CNAME file — see astro.config.mjs. If DNS for that domain
      # isn't live yet, the site is temporarily unreachable at both the
      # custom domain and the old https://<user>.github.io/nachfolge/ path
      # (which now expects assets at "/", not "/nachfolge/") until it is.
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
